services:
  # --- The Bodyguard (Tailscale) ---
  tailscale:
    image: tailscale/tailscale:latest
    container_name: bb-app-tailscale
    hostname: bb-app
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTH_KEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/ts-serve.json
      - TS_CERT_DOMAIN=${TS_CERT_DOMAIN}
      # Exposed to the tailscale process so the serve-config can substitute
      # the app's internal port in ts-serve.json.
      - BB_APP_PORT=${BB_APP_PORT:-38886}
    volumes:
      - tailscale_data:/var/lib/tailscale
      - ./ts-serve.json:/config/ts-serve.json:ro
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped

  # --- The App (bb-app) ---
  bb-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bb-app:local
    container_name: bb-app
    # Sharing the tailscale sidecar's netns: no published host ports, so the
    # app is reachable ONLY over the tailnet (via `tailscale serve`), never
    # exposed on the LAN or the public internet. No funnel.
    network_mode: service:tailscale
    restart: unless-stopped
    environment:
      - PORT=${BB_APP_PORT:-38886}
      - TZ=${TZ:-America/New_York}
      - BB_TELEMETRY=false
      - HOME=/home/node
      # Optional: pin the pi executable used by bb's Pi provider bridge.
      # - BB_PI_BRIDGE_COMMAND=/usr/local/bin/pi
    volumes:
      # Persistent home -> bb data (~/.bb), pi config/state (~/.pi), yadm.
      - bb_app_home:/home/node
      # Agent workspace: mount host ~/Dev read/write so pi can work on repos.
      - /home/rob/Dev:/home/node/Dev
    depends_on:
      - tailscale

volumes:
  tailscale_data:
  bb_app_home: